name: Build Ghost Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NX_NATIVE_COMMAND_RUNNER: 'false'
      DISABLE_V8_COMPILE_CACHE: '1'
    steps:
      - name: Check out Ghost
        uses: actions/checkout@v7
        with:
          repository: slopization/ghost
          ref: main
          submodules: true
          persist-credentials: false

      - name: Check out build configuration
        uses: actions/checkout@v7
        with:
          path: .container-config
          persist-credentials: false

      - name: Check out official Ghost image
        uses: actions/checkout@v7
        with:
          repository: TryGhost/docker-library-ghost
          ref: 1b063bc12b8dfbb8b539a0a04169e4a2f0f8983d
          path: .ghost-image
          persist-credentials: false

      - name: Read Node version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          store-cache: 'false'

      - name: Build Ghost archive
        run: pnpm archive

      - name: Determine Ghost version
        run: |
          version=$(jq -r .version ghost/package.json)
          sha=$(git rev-parse HEAD)
          echo "GHOST_VERSION=${version}" >> "$GITHUB_ENV"
          echo "GHOST_BUILD_VERSION=${version}+${sha:0:7}" >> "$GITHUB_ENV"
          echo "GHOST_SHA=${sha}" >> "$GITHUB_ENV"

      - name: Prepare official Alpine image
        run: |
          git -C .ghost-image apply --check "$GITHUB_WORKSPACE/.container-config/.github/patches/ghost-alpine.patch"
          git -C .ghost-image apply "$GITHUB_WORKSPACE/.container-config/.github/patches/ghost-alpine.patch"
          cp "ghost/ghost-${GHOST_VERSION}.tgz" .ghost-image/6-next/alpine3.23/ghost.tgz
          echo "GHOST_SHA256=$(sha256sum .ghost-image/6-next/alpine3.23/ghost.tgz | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .ghost-image/6-next/alpine3.23
          file: .ghost-image/6-next/alpine3.23/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghost:build
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            GHOST_BUILD_VERSION=${{ env.GHOST_BUILD_VERSION }}
            GHOST_SHA256=${{ env.GHOST_SHA256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/slopization/ghost
            org.opencontainers.image.revision=${{ env.GHOST_SHA }}
            org.opencontainers.image.version=${{ env.GHOST_BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image to GHCR
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag ghost:build "$IMAGE_NAME:latest"
          docker tag ghost:build "$IMAGE_NAME:$GHOST_VERSION"
          docker tag ghost:build "$IMAGE_NAME:$GHOST_SHA"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GHOST_VERSION"
          docker push "$IMAGE_NAME:$GHOST_SHA"

      - name: Export image
        run: docker save ghost:build -o "$RUNNER_TEMP/ghost-image.tar"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: ghost-image
          path: ${{ runner.temp }}/ghost-image.tar
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

name: Build Ghost Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NX_NATIVE_COMMAND_RUNNER: 'false'
      DISABLE_V8_COMPILE_CACHE: '1'
    steps:
      - name: Check out Ghost
        uses: actions/checkout@v4
        with:
          repository: slopization/ghost
          ref: main
          submodules: true
          persist-credentials: false

      - name: Read Node version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          store-cache: 'false'

      - name: Build Ghost admin
        run: pnpm nx run @tryghost/admin:build

      - name: Determine Ghost version
        run: |
          version=$(jq -r .version ghost/package.json)
          sha=$(git rev-parse HEAD)
          echo "GHOST_BUILD_VERSION=${version}+${sha:0:7}" >> "$GITHUB_ENV"
          echo "GHOST_SHA=${sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: selfhost
          platforms: linux/amd64
          load: true
          tags: ghost:build
          build-args: |
            GHOST_BUILD_VERSION=${{ env.GHOST_BUILD_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/slopization/ghost
            org.opencontainers.image.revision=${{ env.GHOST_SHA }}
            org.opencontainers.image.version=${{ env.GHOST_BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ghost:build "$IMAGE_NAME:latest"
          docker tag ghost:build "$IMAGE_NAME:$GHOST_SHA"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GHOST_SHA"

      - name: Export image
        run: docker save ghost:build -o "$RUNNER_TEMP/ghost-image.tar"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ghost-image
          path: ${{ runner.temp }}/ghost-image.tar
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
